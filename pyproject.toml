[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "power-coupling"
version = "0.1.0"
description = "Cross-zonal day-ahead power price econometrics on free public data"
requires-python = ">=3.11"
dependencies = [
    "entsoe-py>=0.6.9",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "requests>=2.31",
    "pyarrow>=16",          # parquet caching
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "jupyterlab>=4",
    "ipykernel>=6",
    "black>=24",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["power_coupling*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.black]
line-length = 100
